name: TWRP Recovery Builder for Infinix Hot 60 Pro (X6885)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP Manifest URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree Repository URL'
        required: true
        default: 'https://github.com/XTENSEI/twrp_infinix_X6885'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/infinix/X6885'
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'X6885'
      MAKEFILE_NAME:
        description: 'Makefile Name'
        required: true
        default: 'twrp_X6885'
      BUILD_TARGET:
        description: 'Build Target Image'
        required: true
        default: 'vendorbootimage'

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    steps:
    - name: Clean Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swift: true

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig ccache zip curl python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Workspace
      run: |
        mkdir -p ~/twrp
        cd ~/twrp
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1

    - name: Sync Source Code
      run: |
        cd ~/twrp
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ~/twrp
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

    - name: Build Recovery Image
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-userdebug
        make ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          ~/twrp/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
          ~/twrp/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
          ~/twrp/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ramdisk-recovery.cpio
